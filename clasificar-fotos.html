<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificar fotos · Carpintería</title>
<style>
  :root { --crema:#f1ece3; --tinta:#1e1a16; --gris:#7a7065; --linea:#d8cfc0; --oro:#d9a441; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--crema); color:var(--tinta);
         font-family:'Segoe UI',system-ui,sans-serif; line-height:1.5; }
  header { position:sticky; top:0; z-index:10; background:var(--tinta); color:var(--crema);
           padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:1rem; text-transform:uppercase; letter-spacing:.12em; margin:0; font-weight:600; }
  header .info { font-size:.8rem; color:#c9bfae; margin-right:auto; }
  button { font:inherit; cursor:pointer; border:none; padding:10px 18px; background:var(--oro);
           color:var(--tinta); font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:.75rem; }
  button.sec { background:transparent; color:var(--crema); border:1px solid #6b6055; }
  main { max-width:1240px; margin:0 auto; padding:28px 24px 90px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:28px; }
  .item { background:#fff; border:1px solid var(--linea); }
  .item.agrupado { border-color:var(--oro); box-shadow:0 0 0 2px rgba(217,164,65,.25); }
  .marco { position:relative; aspect-ratio:1/1; overflow:hidden; background:#e9e2d5; display:block; }
  .marco img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { position:absolute; top:0; left:0; background:var(--tinta); color:var(--crema);
         font-weight:700; font-size:.85rem; padding:6px 12px; }
  .sello { position:absolute; right:8px; bottom:8px; background:var(--oro); color:var(--tinta);
           font-size:.68rem; font-weight:700; padding:4px 9px; text-transform:uppercase;
           letter-spacing:.08em; display:none; }
  .item.agrupado .sello { display:block; }
  .campos { padding:12px; display:grid; gap:8px; }
  label { font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--gris); }
  input, select { width:100%; font:inherit; font-size:.88rem; padding:7px 9px;
                  border:1px solid var(--linea); background:#fff; color:var(--tinta); }
  input:focus, select:focus { outline:2px solid var(--oro); outline-offset:-1px; }
  select.mismo { background:#fbf7f0; }
  #salida { width:100%; height:340px; margin-top:22px; font-family:ui-monospace,Consolas,monospace;
            font-size:.78rem; padding:14px; border:1px solid var(--linea); display:none; }
</style>
</head>
<body>
<header>
  <h1>Clasificar fotos</h1>
  <span class="info">En "Es el mismo mueble que…" elegí de la lista. Se guarda solo en tu navegador.</span>
  <button class="sec" onclick="limpiar()">Borrar todo</button>
  <button onclick="generar()">Generar código</button>
</header>
<main>
  <datalist id="materiales"></datalist>
  <div class="grid" id="grid"></div>
  <textarea id="salida" readonly></textarea>
</main>
<script>
const CATEGORIAS = [{"id": "cocinas", "nombre": "Cocinas"}, {"id": "placares", "nombre": "Placares y vestidores"}, {"id": "banos", "nombre": "Baños y vanitorys"}, {"id": "puertas", "nombre": "Puertas y revestimientos"}, {"id": "muebles", "nombre": "Muebles a medida"}];

XNXxS53eSS3aPVCLbdosrCzR3-vqyfCmch", "titulo": "Trabajo 21", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczM530oyszU9rkwaAhIeMMZkkRHvyEMF64G6NsEUaperlItRzLAocHCPhMUEDfW1M86_bR9Yxu7qGgGFxbsvEGqer_AK3lYBSyO0DzKOKRHa35UIPEUn", "titulo": "Trabajo 22", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczNPzPJd3IXnTvUBmhldXCSd2bRNJ7CFr8-Ad5NMqDByoB5AKdcF7VS0EWyxcrd6_EADaZUOxsONlaxQYWlXaoX1SSSSqX4CAVYs0tTiFNXjTAfbuGsG", "titulo": "Trabajo 23", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczPIyOVPsGI-PID8gZVlqcDPVTfIMpBLa6zehGNaqkPpBC0eKkPL1SFG2GfcSsPitMD-mHaNK-DuBbxaBCfCBLznj5RpJJ5LWQLV08vLx0-iCRHCuDV1", "titulo": "Trabajo 24", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczO-MNSCppq3civPPr6o_qFGNuzNFDlwnv8onscGvABj9vfas-8B_zasB-J47edkmbqB-RmUO37RgyPNewnLHJgH-3n84L0SrpjDrJZK5m7GGRSTW0-D", "titulo": "Trabajo 25", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczP6ljt_w1uMSlwSLxIOY5xKadODgp1y0FGM5dFMaJoe_59x3K2NnR_1M658qZ4v6Te8ZjDl5k1wmpSBJtiFXyXj-3yZAaH6tXwtsa3uFGEKLa2BSy7B", "titulo": "Trabajo 26", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczNTe1zlPNgq-npJ9WI9xy3y7mv6PkRVhzyCjgRf6pJe6JsoX936cpv0V9PknU1XN0OAVJ62Iz_7y--xncz9L9unxWlO72UGE9BIeMVAr8rAKKdPXzNu", "titulo": "Trabajo 27", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczPKaRg2DpjdgfLi1CvBAHhCvNmYj-WYj2qeZtljRJNhLM7ukSwT9e0DlKwTwS4UmvEeGKhufr0ThaNDvCqEMwTjcNyezfZaXbU0CUxuFroXSSpTekaM", "titulo": "Trabajo 28", "detalle": "", "categoria": "muebles"}, {"id": "AP1GczNp-3Lnid7hfNICuVaOb1uNy1JXpubBQQiwLD24izks-bnjVjfqUvaJVzM4j7FuDzo7J2gzoKTAOTwSWHhHkfVX2OiS6QSP1jeCNb2W0DUkBtitgZT1", "titulo": "Trabajo 29", "detalle": "", "categoria": "muebles"}];
const guardado = JSON.parse(localStorage.getItem('clasif') || '{}');

const dato = (id, campo, pd) => {
  const v = (guardado[id] || {})[campo];
  return (v === undefined || v === '') ? pd : v;
};

document.getElementById('materiales').innerHTML =
  MATERIALES.map(m => `<option value="${m}">`).join('');
const grid = document.getElementById('grid');

function opcionesMismo(iActual) {
  let out = '<option value="">— Es un trabajo aparte —</option>';
  FOTOS.forEach((f, i) => {
    if (i === iActual) return;
    const t = dato(f.id, 'titulo', f.titulo);
    const sel = dato(FOTOS[iActual].id, 'mismoQue', '') === String(i) ? 'selected' : '';
    out += `<option value="${i}" ${sel}>Foto ${i + 1} · ${t}</option>`;
  });
  return out;
}

function pintar() {
  grid.innerHTML = '';
  FOTOS.forEach((f, i) => {
    const div = document.createElement('div');
    const mq = dato(f.id, 'mismoQue', '');
    div.className = 'item' + (mq !== '' ? ' agrupado' : '');
    div.innerHTML = `
      <span class="marco">
        <span class="num">${i + 1}</span>
        <img loading="lazy" src="https://lh3.googleusercontent.com/pw/${f.id}=w600-rw-no" alt="">
        <span class="sello">= foto ${Number(mq) + 1}</span>
      </span>
      <div class="campos">
        <div>
          <label>Título</label>
          <input data-id="${f.id}" data-campo="titulo" value="${dato(f.id,'titulo',f.titulo)}">
        </div>
        <div>
          <label>Material (opcional, se puede dejar vacío)</label>
          <input list="materiales" placeholder="lo completás cuando te lo digan"
                 data-id="${f.id}" data-campo="detalle" value="${dato(f.id,'detalle',f.detalle)}">
        </div>
        <div>
          <label>Categoría</label>
          <select data-id="${f.id}" data-campo="categoria">
            ${CATEGORIAS.map(c => `<option value="${c.id}" ${dato(f.id,'categoria',f.categoria)===c.id?'selected':''}>${c.nombre}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Es el mismo mueble que…</label>
          <select class="mismo" data-id="${f.id}" data-campo="mismoQue">${opcionesMismo(i)}</select>
        </div>
      </div>`;
    grid.appendChild(div);
  });
}
pintar();

function guardar(el) {
  if (!el.dataset.id) return;
  guardado[el.dataset.id] = guardado[el.dataset.id] || {};
  guardado[el.dataset.id][el.dataset.campo] = el.value;
  localStorage.setItem('clasif', JSON.stringify(guardado));
}
grid.addEventListener('input', (e) => guardar(e.target));
grid.addEventListener('change', (e) => {
  guardar(e.target);
  if (e.target.dataset.campo === 'mismoQue' || e.target.dataset.campo === 'titulo') pintar();
});

// Resuelve las cadenas: si la 5 es igual a la 3, y la 3 a la 1, todas son el grupo de la 1
function raiz(i, visto = new Set()) {
  if (visto.has(i)) return i;
  visto.add(i);
  const mq = dato(FOTOS[i].id, 'mismoQue', '');
  return mq === '' ? i : raiz(Number(mq), visto);
}

const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function generar() {
  const cuenta = {};
  FOTOS.forEach((_, i) => { const r = raiz(i); cuenta[r] = (cuenta[r]||0)+1; });

  let out = 'export const fotos = [\n';
  FOTOS.forEach((f, i) => {
    const r = raiz(i);
    out += '  {\n';
    out += "    id: '" + f.id + "',\n";
    out += "    titulo: '" + dato(f.id,'titulo',f.titulo).replace(/'/g,"\\'") + "',\n";
    out += "    detalle: '" + dato(f.id,'detalle',f.detalle).replace(/'/g,"\\'") + "',\n";
    out += "    categoria: '" + dato(f.id,'categoria',f.categoria) + "',\n";
    if (cuenta[r] > 1) {
      const base = dato(FOTOS[r].id,'titulo',FOTOS[r].titulo);
      out += "    proyecto: '" + (slug(base) || ('grupo-' + (r+1))) + "',\n";
    }
    out += '  },\n';
  });
  out += ']\n';

  const ta = document.getElementById('salida');
  ta.style.display = 'block';
  ta.value = out;
  ta.scrollIntoView({behavior:'smooth'});
  ta.select();
}

function limpiar() {
  if (!confirm('¿Borrar todo lo que cargaste?')) return;
  localStorage.removeItem('clasif');
  location.reload();
}
</script>

</html>
